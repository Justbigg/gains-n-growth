apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-api
  labels:
    app.kubernetes.io/name: atlas-api
    app.kubernetes.io/part-of: atlas-commerce
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas-api
        app.kubernetes.io/part-of: atlas-commerce
    spec:
      serviceAccountName: atlas-api
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: atlas-registry
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/example/atlas-commerce-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: API_HOST
              value: 0.0.0.0
            - name: API_PORT
              value: '4000'
            - name: DEMO_MODE
              value: 'false'
            - name: DB_POOL_MAX
              value: '10'
            - name: EVENT_TRANSPORT
              value: kafka
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: atlas-api-secrets
                  key: DATABASE_URL
            - name: ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: atlas-api-secrets
                  key: ALLOWED_ORIGINS
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: atlas-api-secrets
                  key: OIDC_ISSUER
            - name: OIDC_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: atlas-api-secrets
                  key: OIDC_AUDIENCE
            - name: OIDC_JWKS_URL
              valueFrom:
                secretKeyRef:
                  name: atlas-api-secrets
                  key: OIDC_JWKS_URL
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: atlas-api-secrets
                  key: KAFKA_BROKERS
            - name: KAFKA_CLIENT_ID
              value: atlas-commerce-api
            - name: KAFKA_SSL
              value: 'true'
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: atlas-api-secrets
                  key: KAFKA_SASL_USERNAME
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-api-secrets
                  key: KAFKA_SASL_PASSWORD
            - name: OTEL_SERVICE_NAME
              value: atlas-commerce-api
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: atlas-api-secrets
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
